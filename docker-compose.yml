services:
    certbot-cloudflare:
        image: certbot/dns-cloudflare:latest
        # a one-shot tool, run by the certificates:certbot-* commands (`docker compose run --rm`),
        # never a long-running service - the profile keeps a bare `docker compose up` from starting it
        profiles: ["certbot"]
        volumes:
            # The IDE's certificate store, shared with nginx (which mounts its live/ and archive/),
            # so issued certificates outlive this package and any other certificate plugin
            - ${IDE_ROOT}/storage/certificates:/etc/letsencrypt
            # the Cloudflare credentials, in storage/plugins/certbot-cloudflare/, are mounted at /storage
            # by the IDE itself ("storage": true in composer.json)
